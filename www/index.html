<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>AR Notes</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="main"></main>
    <nav id="bottombar"></nav>
  </div>

  <div id="scrim" hidden></div>
  <aside id="drawer" aria-label="Menu"></aside>

  <section id="editor" hidden></section>
  <div id="overlay-root"></div>
  <div id="snackbar" hidden></div>

  <input type="file" id="pick-image" accept="image/*" multiple hidden>
  <input type="file" id="pick-keep" multiple hidden>
  <input type="file" id="pick-backup" hidden>

  <script src="lib/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
